name: Build

on:
  push:
    branches:
      - main
  # permite relanzar el despliegue sin tener que tocar codigo
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Los repos nuevos nacen con default_workflow_permissions=read, asi que el
    # GITHUB_TOKEN no puede escribir la rama 'build' (403 al hacer push).
    # Se concede aqui, y solo aqui, en vez de abrir permisos a todo el repo.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npm run build
        env:
          PUBLIC_EMAILJS_SERVICE_ID: ${{ secrets.PUBLIC_EMAILJS_SERVICE_ID }}
          PUBLIC_EMAILJS_TEMPLATE_ID: ${{ secrets.PUBLIC_EMAILJS_TEMPLATE_ID }}
          PUBLIC_EMAILJS_PUBLIC_KEY: ${{ secrets.PUBLIC_EMAILJS_PUBLIC_KEY }}

      # Hostinger vigila la rama 'build' y despliega lo que encuentre ahi.
      # force_orphan la reescribe con un unico commit en cada publicacion, para
      # que no acumule historial de artefactos.
      - name: Publish dist to branch build
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: build
          force_orphan: true
          commit_message: "build: ${{ github.sha }}"
